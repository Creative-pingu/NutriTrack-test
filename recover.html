<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NutriTrack - Full Storage Diagnostic</title>
<style>
body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
#output { background: #f0f0f0; padding: 15px; border-radius: 4px; margin-top: 20px; 
  white-space: pre-wrap; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px; }
</style>
</head>
<body>
<h1>NutriTrack - Full Storage Diagnostic</h1>
<p><strong>Origin:</strong> <span id="origin"></span></p>
<p><strong>Path:</strong> <span id="path"></span></p>
<h3>Checking ALL possible storage locations...</h3>
<h3>Output:</h3>
<pre id="output"></pre>

<script>
var output = document.getElementById("output");
var originEl = document.getElementById("origin");
var pathEl = document.getElementById("path");

function log(msg) {
  output.textContent += msg + "\n";
  output.scrollTop = output.scrollHeight;
}

originEl.textContent = window.location.origin;
pathEl.textContent = window.location.pathname;

log("=== STORAGE DIAGNOSTIC ===");
log("Origin: " + window.location.origin);
log("Path: " + window.location.pathname);
log("");

// The known NutriTrack storage keys
var NT_KEYS = [
  "nt-logs", "nt-goals", "nt-goal-overrides", "nt-custom",
  "nt-profile", "nt-exratio", "nt-recipes", "nt-notion-status",
  "nt-sync-queue", "nt-supplement-stacks", "nt-last-exported-at",
  "nt-last-validated-at", "nt-display-mode", "nt-energy-unit",
  "nt-recents", "nt-error-logs", "nt-last-online", "nt-logs-backup"
];

log("--- Checking Known NutriTrack Keys ---");
var foundCount = 0;
for (var i = 0; i < NT_KEYS.length; i++) {
  var key = NT_KEYS[i];
  var value = localStorage.getItem(key);
  if (value !== null) {
    log("FOUND: " + key + " = " + (value.length > 60 ? value.substring(0, 60) + "..." : value));
    foundCount++;
  }
}
if (foundCount === 0) {
  log("No known NutriTrack keys found in localStorage");
}
log("");

// Check ALL localStorage keys
log("--- ALL localStorage Keys ---");
log("Total: " + localStorage.length);
if (localStorage.length > 0) {
  for (var i = 0; i < localStorage.length; i++) {
    var key = localStorage.key(i);
    var value = localStorage.getItem(key);
    var isNt = NT_KEYS.includes(key) ? " [NT]" : "";
    log(key + isNt + " = " + (value ? value.substring(0, 60) + (value.length > 60 ? "..." : "") : "null"));
  }
} else {
  log("localStorage is COMPLETELY EMPTY");
}
log("");

// Check if we can write to localStorage
log("--- Write Test ---");
try {
  localStorage.setItem("nt-test-write", "test-value");
  var readBack = localStorage.getItem("nt-test-write");
  if (readBack === "test-value") {
    log("Write test: SUCCESS - localStorage is writable");
    localStorage.removeItem("nt-test-write");
  } else {
    log("Write test: FAILED - could not read back");
  }
} catch (e) {
  log("Write test: FAILED - " + e.message);
}
log("");

// Important info
log("=== IMPORTANT ===");
log("If localStorage is EMPTY but you see data in the app:");
log("1. You may be in a DIFFERENT browser profile");
log("2. You may be in incognito/private mode");
log("3. The app might be using a DIFFERENT storage mechanism");
log("4. Try opening DevTools (F12) -> Application -> Storage -> Local Storage");
log("   and check what's actually there for this origin");
</script>
</body>
</html>
