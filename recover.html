<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NutriTrack - Recovery Debug</title>
<style>
body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
#output { background: #f0f0f0; padding: 15px; border-radius: 4px; margin-top: 20px; 
  white-space: pre-wrap; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px; }
button { padding: 10px 20px; margin: 5px; cursor: pointer; }
</style>
</head>
<body>
<h1>NutriTrack Recovery Debug</h1>
<p><strong>Origin:</strong> <span id="origin"></span></p>
<p><strong>localStorage.length:</strong> <span id="ls-length"></span></p>
<div>
  <button onclick="dumpAll()">Dump ALL localStorage</button>
  <button onclick="dumpNt()">Dump NT Keys Only</button>
  <button onclick="checkPrefix()">Check nt- Prefix</button>
</div>
<h3>Output:</h3>
<pre id="output"></pre>

<script>
// Show origin immediately
document.getElementById("origin").textContent = window.location.origin;
document.getElementById("ls-length").textContent = localStorage.length;

function log(msg) {
  var output = document.getElementById("output");
  output.textContent += msg + "\n";
  output.scrollTop = output.scrollHeight;
}

function dumpAll() {
  log("=== ALL localStorage ===");
  log("Total keys: " + localStorage.length);
  for (var i = 0; i < localStorage.length; i++) {
    var key = localStorage.key(i);
    var value = localStorage.getItem(key);
    log(key + " = " + (value ? value.substring(0, 100) : "null"));
  }
  log("=== END ===");
}

function dumpNt() {
  log("=== NT Keys Only ===");
  var count = 0;
  for (var i = 0; i < localStorage.length; i++) {
    var key = localStorage.key(i);
    if (key.startsWith("nt-")) {
      var value = localStorage.getItem(key);
      log(key + " = " + (value ? value.substring(0, 100) : "null"));
      count++;
    }
  }
  log("Found " + count + " nt- keys");
  log("=== END ===");
}

function checkPrefix() {
  log("=== Prefix Check ===");
  var testKey = "nt-test";
  log("Test: does ''' + testKey + ''' start with 'nt-'? " + testKey.startsWith("nt-"));
  log("Test: does ''' + testKey + ''' start with NT_PREFIX? " + testKey.startsWith("nt-"));
  log("NT_PREFIX value: 'nt-'");
  log("=== END ===");
}

log("Recovery debug tool loaded. Origin: " + window.location.origin);
</script>
</body>
</html>
